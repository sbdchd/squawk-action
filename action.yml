name: "Squawk action"
description: "Lint Postgres migrations with Squawk"
author: sbdchd
branding:
  icon: "check-square"
  color: "blue"

inputs:
  access_token:
    description: "Your GitHub Access Token (default: {{ github.token }})"
    default: "${{ github.token }}"
    required: true
    type: string
  assume-in-transaction:
    description: "Assume in transaction"
    required: false
    default: "false"
    type: boolean
  config:
    description: "Path to a custom config file"
    required: false
    default: ""
    type: string
  exclude:
    description: "Rules to exclude, as a comma-separated string"
    required: false
    type: string
  files:
    description: "Space separated list of file paths to check. Cannot contain glob patterns."
    required: false
    default: ""
    type: string
  upload-to-github:
    description: "Comment on a PR with Squawk's results"
    required: false
    default: "true"
    type: boolean
  fail-on-violations:
    description: "Fail on violations"
    required: false
    default: "false"
    type: boolean
  pattern:
    description: "Glob pattern of files to match. (./migrations/*)"
    required: false
    default: ""
    type: string
  pg-version:
    description: "PostgreSQL version"
    required: false
    type: string
  verbose:
    description: "Verbose output"
    required: false
    default: "true"
    type: boolean
  version:
    description: "Squawk NPM version to install (default: latest)"
    default: "latest"
    required: true
    type: string
runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: 20
    - run: npm install -g "squawk-cli@$VERSION"
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
    - shell: bash
      env:
        INPUT_ASSUME_IN_TRANSACTION: ${{ inputs.assume-in-transaction }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_UPLOAD_TO_GITHUB: ${{ inputs.upload-to-github }}
        INPUT_FAIL_ON_VIOLATIONS: ${{ inputs.fail-on-violations }}
        INPUT_FILES: ${{ inputs.files }}
        INPUT_PATTERN: ${{ inputs.pattern }}
        INPUT_PG_VERSION: ${{ inputs.pg-version }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
        INPUT_ACCESS_TOKEN: ${{ inputs.access_token }}
      run: |
        ASSUME_IN_TRANSACTION="$INPUT_ASSUME_IN_TRANSACTION"
        CONFIG="$INPUT_CONFIG"
        EXCLUDE="$INPUT_EXCLUDE"
        UPLOAD_TO_GITHUB="$INPUT_UPLOAD_TO_GITHUB"
        FAIL_ON_VIOLATIONS="$INPUT_FAIL_ON_VIOLATIONS"
        FILES="$INPUT_FILES"
        PATTERN="$INPUT_PATTERN"
        PG_VERSION="$INPUT_PG_VERSION"
        VERBOSE="$INPUT_VERBOSE"

        COMMAND=(squawk)

        if "$ASSUME_IN_TRANSACTION"; then
          COMMAND+=(--assume-in-transaction)
        fi

        if [ -n "$CONFIG" ]; then
          COMMAND+=("--config=$CONFIG")
        fi

        if [ -n "$EXCLUDE" ]; then
          COMMAND+=("--exclude=$EXCLUDE")
        fi

        if [ -n "$PG_VERSION" ]; then
          COMMAND+=("--pg-version=$PG_VERSION")
        fi

        if "$VERBOSE"; then
          COMMAND+=(--verbose)
        fi

        # We can only leave a comment when we run on pull_request.
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          if "$UPLOAD_TO_GITHUB"; then
            COMMAND+=(upload-to-github)
          fi

          if "$FAIL_ON_VIOLATIONS"; then
            COMMAND+=(--fail-on-violations)
          fi
        fi

        if [ -n "$FILES" ]; then
          # FILES is a space-separated list of paths (no globs).
          read -ra FILES_ARRAY <<< "$FILES"
          COMMAND+=("${FILES_ARRAY[@]}")
        fi

        if [ -n "$PATTERN" ]; then
          while IFS= read -r -d '' file; do
            COMMAND+=("$file")
          done < <(find . \( -path "./$PATTERN" -or -path "$PATTERN" \) -type f -print0)
        fi

        export SQUAWK_GITHUB_API_URL=$GITHUB_API_URL
        export SQUAWK_GITHUB_TOKEN="$INPUT_ACCESS_TOKEN"
        export SQUAWK_GITHUB_REPO_OWNER=$(jq --raw-output .repository.owner.login "$GITHUB_EVENT_PATH")
        export SQUAWK_GITHUB_REPO_NAME=$(jq --raw-output .repository.name "$GITHUB_EVENT_PATH")
        export SQUAWK_GITHUB_PR_NUMBER=$(jq --raw-output .pull_request.number "$GITHUB_EVENT_PATH")

        echo "Running: ${COMMAND[*]}"
        "${COMMAND[@]}"
