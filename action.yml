name: "Squawk action"
description: "Lint Postgres migrations with Squawk"
author: sbdchd
branding:
  icon: "check-square"
  color: "blue"

inputs:
  access_token:
    description: "Your GitHub Access Token (default: {{ github.token }})"
    default: "${{ github.token }}"
    required: true
  assume-in-transaction:
    description: "Assume in transaction"
    required: false
    default: "false"
  config:
    description: "Path to a custom config file"
    required: false
    default: ""
  exclude:
    description: "Rules to exclude, as a comma-separated string"
    required: false
    default: ""
  files:
    description: "Space separated list of file paths to check. Cannot contain glob patterns."
    required: false
    default: ""
  upload-to-github:
    description: "Comment on a PR with Squawk's results"
    required: false
    default: "true"
  fail-on-violations:
    description: "Fail on violations"
    required: false
    default: "false"
  pattern:
    description: "Glob pattern of files to match. (./migrations/*)"
    required: false
    default: ""
  pg-version:
    description: "PostgreSQL version"
    required: false
    default: ""
  verbose:
    description: "Verbose output"
    required: false
    default: "true"
  version:
    description: "Squawk NPM version to install (default: latest)"
    default: "latest"
    required: true
runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
    - run: npm install -g "squawk-cli@$VERSION"
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
    - shell: bash
      env:
        INPUT_ASSUME_IN_TRANSACTION: ${{ inputs.assume-in-transaction }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_UPLOAD_TO_GITHUB: ${{ inputs.upload-to-github }}
        INPUT_FAIL_ON_VIOLATIONS: ${{ inputs.fail-on-violations }}
        INPUT_FILES: ${{ inputs.files }}
        INPUT_PATTERN: ${{ inputs.pattern }}
        INPUT_PG_VERSION: ${{ inputs.pg-version }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
        INPUT_ACCESS_TOKEN: ${{ inputs.access_token }}
      run: |
        set -euo pipefail

        COMMAND=(squawk)

        if [ "$INPUT_ASSUME_IN_TRANSACTION" = "true" ]; then
          COMMAND+=(--assume-in-transaction)
        fi

        if [ -n "$INPUT_CONFIG" ]; then
          COMMAND+=("--config=$INPUT_CONFIG")
        fi

        if [ -n "$INPUT_EXCLUDE" ]; then
          COMMAND+=("--exclude=$INPUT_EXCLUDE")
        fi

        if [ -n "$INPUT_PG_VERSION" ]; then
          COMMAND+=("--pg-version=$INPUT_PG_VERSION")
        fi

        if [ "$INPUT_VERBOSE" = "true" ]; then
          COMMAND+=(--verbose)
        fi

        # We can only leave a comment when we run on pull_request.
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          if [ "$INPUT_UPLOAD_TO_GITHUB" = "true" ]; then
            COMMAND+=(upload-to-github)
          fi

          if [ "$INPUT_FAIL_ON_VIOLATIONS" = "true" ]; then
            COMMAND+=(--fail-on-violations)
          fi
        fi

        if [ -n "$INPUT_FILES" ]; then
          # INPUT_FILES is a space-separated list of paths (no globs).
          read -ra FILES_ARRAY <<< "$INPUT_FILES"
          COMMAND+=("${FILES_ARRAY[@]}")
        fi

        if [ -n "$INPUT_PATTERN" ]; then
          while IFS= read -r -d '' file; do
            COMMAND+=("$file")
          done < <(find . \( -path "./$INPUT_PATTERN" -or -path "$INPUT_PATTERN" \) -type f -print0)
        fi

        SQUAWK_GITHUB_REPO_OWNER="$(jq --raw-output .repository.owner.login "$GITHUB_EVENT_PATH")"
        SQUAWK_GITHUB_REPO_NAME="$(jq --raw-output .repository.name "$GITHUB_EVENT_PATH")"
        SQUAWK_GITHUB_PR_NUMBER="$(jq --raw-output .pull_request.number "$GITHUB_EVENT_PATH")"
        export SQUAWK_GITHUB_API_URL="$GITHUB_API_URL"
        export SQUAWK_GITHUB_TOKEN="$INPUT_ACCESS_TOKEN"
        export SQUAWK_GITHUB_REPO_OWNER
        export SQUAWK_GITHUB_REPO_NAME
        export SQUAWK_GITHUB_PR_NUMBER

        echo "Running: ${COMMAND[*]}"
        "${COMMAND[@]}"
